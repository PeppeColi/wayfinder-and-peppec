[package]
name = "wayfinder-and-peppec"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "notes"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
jiff = { version = "1.0.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[[test]]
name = "e2e"
path = "tests/e2e.rs"
test = false
